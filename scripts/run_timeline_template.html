function childrenOf(i){
  const c = V(), pa = parentArray(), out = [];
  for (let k = 0; k < c.n; k++) if (pa[k] === i) out.push(k);
  out.sort((a,b) => c.t0[a] - c.t0[b]);
  return out;
}
function ancestry(i){
  const c = V(), pa = parentArray(), out = [];
  let p = pa[i];
  while (p >= 0){ out.unshift(p); p = pa[p]; }
  return out;
}
function select(i){
  S.sel = (i === null || i === undefined) ? null : i;
  S.treeRoot = S.sel === null ? -1 : S.sel;
  draw(); renderInv(); renderTree();
}
function renderTree(){
  const c = V(), cb = document.getElementById("crumbs"),
        tb = document.getElementById("treeBody"), ti = document.getElementById("treeInfo");
  if (S.sel === null){
    cb.innerHTML = "";
    ti.textContent = "";
    tb.innerHTML = '<div class="empty">Click any bar in the timeline (or a row in the inventory) to drill into its call tree.</div>';
    return;
  }
  const chain = ancestry(S.sel).concat([S.sel]);
  let h = "";
  chain.forEach((sp, k) => {
    if (k) h += '<span class="arw">&rsaquo;</span>';
    h += '<span class="cb' + (k === chain.length-1 ? " cur" : "") + '" data-i="' + sp + '">' +
         esc(c.nm[c.st[sp]]) + "</span>";
  });
  cb.innerHTML = h;

  const kids = childrenOf(S.treeRoot);
  const dur = c.dur[S.sel] * 1000;
  ti.textContent = "case " + caseOf(S.sel) + "  " + esc(c.nm[c.st[S.sel]]) + "  " + fmtMs(dur) +
    (kids.length ? "  " + kids.length + " direct child call(s)" : "  leaf call");
  if (!kids.length){
    tb.innerHTML = '<div class="empty">Leaf stage &mdash; no nested instrumented calls.</div>';
    return;
  }
  const maxD = Math.max.apply(null, kids.map(k => c.dur[k]));
  const cm = colorModel(c);
  let s = "";
  for (const k of kids){
    const w = Math.max(2, c.dur[k] / maxD * 190);
    s += '<div class="tnode" data-i="' + k + '">' +
      '<span class="sw" style="width:9px;height:9px;border-radius:2px;background:' +
        cm.col[k] + '"></span>' +
      '<span class="nm">' + esc(c.nm[c.st[k]]) + "</span>" +
      '<span class="bar" style="width:' + w + 'px"></span>' +
      '<span class="du">' + fmtMs(c.dur[k]*1000) + "</span>" +
      '<span class="kd">d' + c.dp[k] + " &middot; " + c.lane_name[c.th[k]] + "</span></div>";
  }
  tb.innerHTML = s;
}
document.getElementById("treeBody").addEventListener("click", e => {
  const n = e.target.closest(".tnode"); if (!n) return;
  const i = +n.dataset.i; S.sel = i; S.treeRoot = i; draw(); renderInv(); renderTree();
});
document.getElementById("crumbs").addEventListener("click", e => {
  const b = e.target.closest(".cb"); if (!b) return;
  const i = +b.dataset.i; S.sel = i; S.treeRoot = i; draw(); renderInv(); renderTree();
});

/* ------------------------------------------------------------ header bits */
function fmtWall(ms){
  return ms >= 1000 ? (ms/1000).toFixed(1)+" s" : ms.toFixed(0)+" ms";
}
function renderStats(){
  const c = V(), merged = (S.mode === "all");
  const cm = colorModel(c);
  const errRow = ["error spans", cm.badCount ? cm.badCount.toLocaleString() : "0",
    cm.badCount ? "invariants violated - hover a red bar for which one"
                : "none: self + children == wall, and every span is inside its case's own slice"];
  let st;
  if (merged){
    /* the sweep: the cases were run back to back, so the x axis is the sweep's
     * real elapsed time and each row occupies its own slice of it.  The axis
     * extent and the sweep wall are then the same measurement, not two. */
    st = [
      ["cases", String(DATA.cases.length), DATA.cases.map(c => c.label).join(", ") +
        " - run back to back, one continuous clock"],
      ["sweep wall", fmtWall(c.sum_ms), "elapsed time of the whole run, first case to last"],
      ["slowest case", fmtWall(c.longest.ms), c.longest.label],
      ["spans", fmtN(c.n), DATA.cases.map(x => fmtN(x.n)).join(" + ") + " recorded"],
      ["drawn", "0", "pass min-duration + filters"],
      errRow,
      ["receptor blocks", fmtN(MERGED.kindCount[KIND.PAIR]), "analyze_pair, one per (array, receptor)"],
      ["sub-panel tasks", fmtN(MERGED.kindCount[KIND.SUB]), "_analyze_single, " +
        (MERGED.kindCount[KIND.PAIR] ? (MERGED.kindCount[KIND.SUB]/MERGED.kindCount[KIND.PAIR]).toFixed(0) : "0") +
        " per block"],
      ["busiest", c.busiest.name, fmtWall(c.busiest.ms) + " in one case"],
      ["parallel", c.par ? c.par : "n/a", "peak concurrency"],
    ];
  } else {
    st = [
      ["case", c.label, "focused view - click the row name in the merged view to go back"],
      ["case wall", fmtWall(c.dur_ms), "its own stage spans, start to end"],
      ["on the sweep clock", fmtT(c.t_off_ms) + " \u203a " + fmtT(c.t_off_ms + c.dur_ms),
        "where it sits in the back-to-back run"],
      ["spans", fmtN(c.n), "stage calls recorded"],
      ["drawn", "0", "pass min-duration + filters"],
      errRow,
      ["lanes", String(c.n_lanes), "worker lanes + main"],
      ["max depth", String(c.max_depth), "nesting"],
      ["busiest", c.busiest.name, fmtWall(c.busiest.ms)],
      ["parallel", c.par ? c.par : "n/a", "peak concurrency"],
    ];
  }
  /* The zoom row answers the question the old window model made unanswerable:
   * "is the rest of the run still there, or did I cut it off?"  The zoom is a
   * scale on the WHOLE axis, so the answer in the merged view is always "still
   * there, scroll to it" - and saying so explicitly matters, because a reader
   * whose zoom is deep enough that no second case fits on screen has no other
   * way to tell that from a window that clipped them away.  The focused case is
   * the honest exception and says so: its axis is that case's own slice, so the
   * other cases really are absent at any zoom, and the row points at Esc. */
  const zMax = maxZoom(), atCap = (S.zoom > 1.002 && S.zoom >= zMax - 1e-6);
  const ax = caseSpan(c);
  st = st.concat([[
    "zoom",
    (S.zoom < 1.005 ? "fit"
      : S.zoom.toFixed(S.zoom < 10 ? 2 : 1) + "x" + (atCap ? " (canvas limit " + zMax.toFixed(0) + "x)" : "")),
    merged
      ? "the whole " + fmtT(ax.t1 - ax.t0) + " sweep is always on the axis - scroll sideways to any case"
      : "axis is this case's own " + fmtT(ax.t1 - ax.t0) + " slice only; the other cases are not on it at any zoom - Esc for the full sweep"
  ]]);
  /* The range row is deliberately a REPORT and not a filter: the drawn count above
   * covers the whole chart whatever this says, and the note says so explicitly,
   * because "a selection" in most tools means "hide the rest" and a reader who
   * assumed that would be right to be surprised.  Times are absolute sweep time,
   * so the row keeps its meaning after a case switch. */
  const rg = S.range;
  st = st.concat([[
    "range",
    rg ? fmtT(rg.t1 - rg.t0) + "  (" + fmtT(rg.t0) + " \u2013 " + fmtT(rg.t1) + ")" : "none",
    rg
      ? "the drag that made it also magnified it; Enter or the button zooms back out"
      : "drag across the chart to select a range and zoom into it; click empty space to clear it"
  ]]);
  document.getElementById("stats").innerHTML = st.map(s =>
    '<div class="stat"><b>' + esc(String(s[1])) + '</b><span>' + esc(String(s[0])) + " &middot; " +
    esc(String(s[2])) + "</span></div>").join("");
}
/* ONE legend for both views, keyed on the top-level function.  It replaced two
 * different legends - phase in the focused view, work type in the merged one -
 * because a legend has to describe the colour the reader can actually see, and
 * both of those had stopped doing that.  A branch swatch is its whole ramp, so
 * "one tone, many shades" is visible in the key itself; the hover names every
 * shade with its self time. */
function renderLegend(){
  const cm = colorModel(V());
  let h = '<div class="li hd">function</div>';
  for (const b of cm.branches){
    const off = S.hiddenBranch.has(b.name) ? " off" : "";
    const grad = b.ramp.length > 1
      ? "linear-gradient(90deg," + b.ramp.join(",") + ")" : b.ramp[0];
    const title = (b.known ? "" : "unlisted branch, neutral hue. ") +
      b.keys.map(k => k.name + "  " + fmtWall(k.self * 1000)).join("\n");
    h += '<div class="li' + off + '" data-b="' + esc(b.name) + '" title="' + esc(title) + '">' +
      '<span class="sw swg" style="background:' + grad + '"></span>' +
      '<span class="nm">' + esc(b.name) + "</span>" +
      '<span class="ct">' + b.nShades + " shade" + (b.nShades === 1 ? "" : "s") + "</span></div>";
  }
  h += '<div class="li" id="clearPhases" style="margin-left:6px;color:var(--dim)">show all</div>';
  h += '<div class="li' + (cm.badCount ? " err" : "") + '" id="errChip">' +
    '<span class="sw" style="background:' + ERR_COLOR + '"></span>' +
    '<span class="nm">error</span><span class="ct">' + cm.badCount + "</span></div>";
  document.getElementById("legend").innerHTML = h;
}
document.getElementById("legend").addEventListener("click", e => {
  if (e.target.closest("#errChip")) return;          // a status, not a filter
  if (e.target.closest("#clearPhases")){ S.hiddenBranch.clear(); }
  else {
    const li = e.target.closest(".li"); if (!li || li.dataset.b === undefined) return;
    const b = li.dataset.b;
    if (S.hiddenBranch.has(b)) S.hiddenBranch.delete(b); else S.hiddenBranch.add(b);
  }
  renderLegend(); draw(); renderInv();
});

/* min-duration slider is logarithmic: 0.01 ms .. 1 s */
const SLIDER_MAX = 100;
function sliderToMs(v){
  if (v <= 0) return 0;
  return Math.pow(10, -2 + 2 * (v / SLIDER_MAX));
}
document.getElementById("minDur").addEventListener("input", e => {
  S.minDur = sliderToMs(+e.target.value);
  document.getElementById("minDurLbl").textContent =
    S.minDur === 0 ? "off" : (S.minDur < 1 ? S.minDur.toFixed(2)+" ms" : S.minDur.toFixed(0)+" ms");
  draw();
});
document.getElementById("search").addEventListener("input", e => {
  S.query = e.target.value.trim().toLowerCase();
  draw(); renderInv();
});
document.getElementById("laneSeg").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  S.lane = b.dataset.lane;
  for (const x of document.querySelectorAll("#laneSeg button")) x.classList.toggle("on", x === b);
  S.isoThread = null;
  syncRowHControl();
  resize(); draw();
});
/* Keep the slider and its label in step with the effective row height.  The two
 * differ on purpose: S.rowH is null until the reader touches the slider, so each
 * mode/lane can carry its own default and switching between them re-picks it -
 * but the control must show whatever is actually in force, or the number on
 * screen would be a lie. */
function syncRowHControl(){
  document.getElementById("rowH").value = String(rowH());
  document.getElementById("rowHLbl").textContent = rowH() + " px";
}
document.getElementById("caseSel").addEventListener("change", e => focusCase(+e.target.value));
document.getElementById("btnAll").addEventListener("click", showAllCases);
document.getElementById("btnZoomSel").addEventListener("click", zoomToRange);
document.getElementById("btnReset").addEventListener("click", resetAll);
/* focus one case: leave the merged view, keep the filters, drop the zoom and
 * the selection (both are index-space bound - a merged index means nothing in
 * the focused case) */
function focusCase(k){
  cancelDrag();                        // a half-finished drag must not follow us
  S.ci = k; S.mode = "case";
  S.sel = null; S.treeRoot = -1; S.zoom = 1; S.isoThread = null;
  document.getElementById("caseSel").value = String(k);
  document.getElementById("btnAll").hidden = false;
  buildOrder(); syncRowHControl(); resetPane(); resize(); renderAll();
}
function showAllCases(){
  cancelDrag();
  S.mode = "all";
  S.sel = null; S.treeRoot = -1; S.zoom = 1; S.isoThread = null;
  document.getElementById("btnAll").hidden = true;
  buildOrder(); syncRowHControl(); resetPane(); resize(); renderAll();
}
function resetAll(){
  cancelDrag();
  S.sel = null; S.treeRoot = -1; S.zoom = 1; S.hiddenBranch.clear();
  S.range = null;
  syncRangeUI();                            // the button is disabled by this, renderAll redraws the row
  S.isoThread = null; S.query = ""; S.minDur = sliderToMs(+document.getElementById("minDur").value);
  S.rowH = null;                       // back to the mode's own default
  document.getElementById("search").value = "";
  document.getElementById("rowH").value = String(defaultRowH());
  document.getElementById("rowHLbl").textContent = rowH() + " px";
  S.sortKey = "wall"; S.sortDir = -1;
  buildOrder(); resetPane(); resize(); renderAll();
}
/* A mode switch or a reset changes the content size, and the browser clamps the
 * scroll offsets asynchronously - so a stale offset would leave the pane showing
 * blank margin.  Zeroing explicitly is clearer than relying on that clamp, and it
 * keeps the sticky overlays and the scrollbar in agreement about where we are. */
function resetPane(){
  const p = document.getElementById("scroller");
  p.scrollLeft = 0; p.scrollTop = 0;
  S.sx = 0; S.sy = 0;
}
/* Row height: the y axis is categorical, so this is the only way to make it
 * bigger.  It changes the virtual height, so the pane's scrollable range changes
 * too - hence resize() (and its clampScroll) rather than a bare redraw. */
document.getElementById("rowH").addEventListener("input", e => {
  S.rowH = +e.target.value;
  document.getElementById("rowHLbl").textContent = S.rowH + " px";
  resize(); draw();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape"){
    /* one step back at a time: focused case -> merged view -> full reset */
    cancelDrag();
    if (S.mode === "case") showAllCases();
    else resetAll();
  }
  else if (e.key === "Enter"){
    /* Enter magnifies the range, and only if there is one.  Since the drag now
     * magnifies as well, this is mostly the way BACK OUT - the same
     * toggle `zoomToRange()` is for the button - so a reader who has dived in can
     * surface again without hunting for Reset, which is a much larger hammer. */
    zoomToRange();
  }
  else if (e.key === "ArrowLeft" || e.key === "ArrowRight"){
    if (!geom) return;
    /* Arrows PAN the axis.  They used to shift the time WINDOW, which is exactly
     * the "cut the edge" behaviour being removed: a key that moves a window can
     * only move that window, whereas a scroll always addresses the whole content
     * and the browser clamps it at both ends for free.  The scroll listener is
     * what repaints, so this only has to move the offset. */
    const p = document.getElementById("scroller");
    const stepPx = Math.max(40, (paneW() - padL()) * 0.12);
    p.scrollLeft += (e.key === "ArrowLeft" ? -stepPx : stepPx);
    syncScroll();
  }
});
/* the case label is the first column: the export is per-view, and in the
 * merged view one file covers six cases, so a span id alone would be ambiguous */
function buildCsv(){
  const c = V(), cm = colorModel(c);
  const lines = ["case,span_id,parent_id,stage,function,error,phase,lane,depth,t0_s,t1_s,self_s"];
  for (const i of order){
    if (!visible(i)) continue;
    lines.push(['"' + caseOf(i) + '"', c.id[i], c.pid[i], '"' + c.nm[c.st[i]] + '"',
      '"' + cm.nameOf(i) + '"', cm.bad[i] ? '"' + cm.whyOf(i) + '"' : "",
      c.phn[c.ph[i]], c.lane_name[c.th[i]], c.dp[i],
      (c.t0[i]/1000).toFixed(6), (c.t1[i]/1000).toFixed(6),
      (c.self[i]).toFixed(6)].join(","));
  }
  return lines;
}
document.getElementById("btnCsv").addEventListener("click", () => {
  const blob = new Blob([buildCsv().join("\n")], {type:"text/csv"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = (S.mode === "all" ? "all_cases" : C().label) + "_timeline.csv";
  a.click();
});

/* ------------------------------------------------------------------ boot */
function init(){
  const sel = document.getElementById("caseSel");
  sel.innerHTML = DATA.cases.map((c,i) => '<option value="' + i + '">' + esc(c.label) + "</option>").join("");
  document.getElementById("minDurLbl").textContent = "1.0 ms";
  document.getElementById("footNote").innerHTML =
    "Data: <code>output/&lt;case&gt;/results/run_spans.csv</code> written by <code>scripts/run_analysis.py</code>; " +
    "aggregate inventory from <code>run_profile.csv</code>. Built by <code>scripts/build_run_timeline.py</code> " +
    "on " + esc(DATA.built) + ". Lanes are concurrent worker slots &mdash; the pipeline builds one " +
    "ThreadPoolExecutor per (array, receptor) pair, so " + DATA.cases[0].n_threads.toLocaleString() +
    " thread objects map onto " + DATA.cases[0].n_lanes + " reusable lanes. " +
    "Each case is a separate run with its own timer, and <code>run_analysis.py</code> runs them " +
    "back to back, so the merged axis is the sweep's real elapsed time: case k starts exactly where " +
    "case k&minus;1 ended and the rows are directly comparable. Focusing one case keeps that case's " +
    "own slice as the full axis. Bars are coloured by top-level function &mdash; one hue per branch, " +
    "a lightness ramp across the sub-functions inside it, brightest where the self time is &mdash; and " +
    "red is reserved for a span that breaks a timing invariant, never for a function. " +
    "In the merged view a wide block is one " +
    "<code>analyze_pair</code> (one array &times; receptor) and the ticks in the same row are its " +
    "&times; groups <code>_analyze_single</code> calls: they overlap the block in time but are not its " +
    "children, because profiler parent links are thread-local. " +
    "Self-contained: no network, no external JS.";
  buildOrder();
  /* the slider starts at the mode's default so the control and the state agree
   * on the first paint; S.rowH stays null until the reader moves it, so each
   * mode keeps its own default when they switch (see defaultRowH) */
  document.getElementById("rowH").value = String(defaultRowH());
  document.getElementById("rowHLbl").textContent = rowH() + " px";
  resize();
  renderAll();
  /* the pane's own scrolling, whichever way it was produced - wheel, scrollbar
   * drag, middle drag, arrow keys, scrollbar track click.  The sticky gutter and
   * time axis are painted from S.sx/S.sy, so this listener is what keeps them
   * honest; without it they would sit at the last offset the page set itself. */
  document.getElementById("scroller").addEventListener("scroll", () => { syncScroll(); draw(); });
  window.addEventListener("resize", () => { resize(); draw(); });
}
init();
</script>
</body>
</html>
