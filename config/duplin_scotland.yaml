  # 56.373358 -3.542267 126.92
  - name: "Dupplin PV Area"
    lat: 56.376594          # polygon centroid (vertex average)
    lon: -3.544063
    height_agl_m: 2.67       # report: height above ground 2.67 m
    width_m: 909.0           # N-S extent (area 1.21 km2 / 1333 m E-W, bbox 1782x1215)
    height_m: 1333.0         # E-W long axis (matches polygon bbox aspect)
    tilt_deg: 20.0
    azimuth_deg: 180.0       # true south
    groups: 16               # split E-W height axis for near-field route points
    specular_reflectivity: 0.08

