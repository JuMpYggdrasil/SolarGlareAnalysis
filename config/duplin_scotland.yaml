# =============================================================================
# Dupplin Solar (Scotland, UK) - 100% replicable ForgeSolar benchmark case.
# Source: "Glare Analysis - Dupplin Solar v1", BLC Energy ForgeSolar report,
#   created 08 Jan 2026 / updated 16 Jan 2026 (24-page PDF), public URL:
#   https://www.blcenergy.com/wp-content/uploads/2026/03/Volume-4-Technical-
#   Appendix-Glint-and-Glare-Appendix-A-Forge-Solar-Analysis.pdf
#
# Report settings (must be reproduced exactly):
#   Time-step 1 minute, timezone offset UTC+0 (standard time; DST +1h)
#   Minimum sun altitude 0.0 deg, DNI peaks at 1000 W/m2
#   Ocular transmission coefficient 0.5, pupil 0.002 m, focal length 0.017 m
#   Sun subtended angle 9.3 mrad, PV analysis methodology V2
#   Panel material: Smooth glass with AR coating; Reflectivity: vary with sun
#   Slope error: correlate with material  -> ARC correlate 8.43 mrad (SGHAT v6
#   Table 2). Fixed specular reflectivity 0.08 used here (ARC worst case).
#
# Published annual results (glare minutes per receptor):
#   A9       : Green 7     + Yellow 1,051
#   Roman Rd : Green 267   + Yellow 2,892
#   Rural Rd : Green 514   + Yellow 2,226
#   OP 13    : Green 123   + Yellow 0
#   All other OP 1-18 (except 13) and route points: no glare
#   Array total: Green 911 + Yellow 6,169 = 7,080 min/yr
#
# MODEL LIMITATIONS (read before comparing numbers):
#   - The report models the 97.8 MW array as a 37-vertex polygon (~1.21 km2,
#     bbox ~1782 m E-W x ~1215 m S-N, centroid 56.376594 N, -3.544063 E,
#     height 2.67 m AGL). This pipeline models ONE flat rectangle panel
#     (width_m x height_m, area 1.21 km2, split into `groups` along the
#     height axis = E-W, matching the polygon's long axis). The subtended
#     angle x = min(beta, theta) is driven by area/distance so the rectangle
#     approximation is reasonable for far-field receptors.
#   - Route receptors (A9, Roman Rd, Rural Road) are two-way paths with a 50
#     deg azimuthal view angle. Here each route VERTEX is modelled as a
#     discrete point receptor at 1.5 m AGL; per-minute union across a route's
#     points approximates the report's per-route total.
#   - The report includes 17 obstruction/hedgerow components that block glare;
#     this pipeline has no obstruction model, so computed minutes can exceed
#     the report. Compare per-receptor, order-of-magnitude + behavioural.
#
# Usage: copy to config/site.yaml (or point run_analysis/validate scripts at
#   this file) and run the standard pipeline with DNI constant 1000 W/m2.
# =============================================================================

site:
  name: "Dupplin Solar, Scotland (ForgeSolar report benchmark)"
  reference: { lat: 56.376594, lon: -3.544063, height_m: 120.0 }
  timezone: "UTC"
  year: 2026
  time_freq: "min"
  linke_turbidity: 3.5

environment:
  slope_error_rad: 0.00843   # SGHAT v6 Table 2 ARC correlate (smooth glass + ARC)
  min_dni_wm2: 0.0           # report has no DNI floor
  dni_mode: "ineichen"       # report: "DNI peaks at 1000 W/m2" = VARIABLE DNI
  dni_constant_wm2: 1000.0
  reflectivity_mode: "constant"  # deliberate: ForgeSolar "Fixed specular reflectivity 0.08" (report setting)

